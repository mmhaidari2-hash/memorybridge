<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MemoryBridge</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:14px;width:280px;background:#08111f;color:#f5f7fb}h1{font-size:16px;margin:0 0 8px}p,.sub{color:#9eabc0;font-size:12px;line-height:1.45}input,textarea,button{width:100%;margin-top:8px;border-radius:8px;border:1px solid #24344a;background:#0f1b2b;color:#f5f7fb;padding:8px}button{font-weight:700;cursor:pointer}#status{margin-top:8px;font-size:12px}</style>
</head>
<body>
<h1>MemoryBridge companion</h1>
<p class="sub">Pair from the Dashboard, then save a local draft. This does not send API keys and does not change paid entitlement.</p>
<div id="origin" class="sub">Not paired</div>
<input id="title" maxlength="120" placeholder="Draft title">
<textarea id="body" rows="4" placeholder="Local note"></textarea>
<button id="save" type="button">Save draft to open app tab</button>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>

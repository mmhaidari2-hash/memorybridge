name: CI

on:
  push:
    branches:
      - main
      - v0.2-secure-foundation
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://memorybridge:memorybridge@localhost:5432/memorybridge
      ENCRYPTION_KEY: eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=
      SERVICE_API_KEYS: mbs_ci_service_key_abcdefghijklmnopqrstuv
      ADMIN_API_KEY: mba_ci_admin_key_abcdefghijklmnopqrstuvwxyz0123
      TOKEN_HASH_PEPPER: cGVwcGVyLXBlcHBlci1wZXBwZXItcGVwcGVyIQ==
      RATE_LIMIT_REQUESTS: "1000"
      RATE_LIMIT_WINDOW_SECONDS: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall app routers main.py memorybridge_client.py

      - name: Run tests
        run: pytest -q

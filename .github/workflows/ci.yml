name: CI

on:
  push:
    branches:
      - main
      - v0.2-secure-foundation
      - v0.4-commercial-foundation
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://memorybridge:memorybridge@localhost:5432/memorybridge
      ENCRYPTION_KEY: eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall app routers main.py memorybridge_client.py scripts

      - name: Validate deployment smoke CLI
        run: python scripts/deployment_smoke.py --help

      - name: Validate loopback records CLI
        run: python scripts/loopback_bridge.py --help

      - name: Run tests
        run: pytest -q
